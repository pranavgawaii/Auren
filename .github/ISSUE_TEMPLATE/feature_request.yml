name: Feature Request
description: Suggest a new feature or enhancement.
title: "[feature]: "
labels: ["enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Before submitting, check [ROADMAP.md](../../ROADMAP.md) to see if this is already planned.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the pain point or limitation you are experiencing.
      placeholder: |
        I often need to send Slack messages as part of my workflow, but there is currently no way to do this through Auren.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe your ideal solution. Example commands are especially helpful.
      placeholder: |
        Add a `slack_send` tool so I can type:
        "Send @channel in #eng-alerts: deployment succeeded for v0.3.0"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you considered.
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: How important is this to you?
      options:
        - Nice to have
        - Important
        - Blocking my use case
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission checklist
      options:
        - label: I have checked ROADMAP.md and this is not already listed.
          required: true
        - label: I have searched existing issues and this is not a duplicate.
          required: true
