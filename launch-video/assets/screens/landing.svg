<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Satoshi, Inter, system-ui, sans-serif">
  <!-- Auren landing hero — layout-accurate reconstruction for After Effects.
       Groups are id-tagged so each becomes a named, animatable AE layer. -->

  <defs>
    <radialGradient id="heroGlow" cx="50%" cy="8%" r="70%">
      <stop offset="0%" stop-color="#E8593C" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#F5A623" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FAF8F5" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#241B14" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g id="canvas">
    <rect width="1440" height="900" fill="#FAF8F5"/>
    <rect id="hero-glow" width="1440" height="640" fill="url(#heroGlow)"/>
  </g>

  <g id="nav">
    <g id="nav-logo">
      <circle cx="132" cy="52" r="14" fill="#F5845E"/>
      <text x="156" y="60" font-size="22" fill="#241B14" font-family="Cabinet Grotesk, Georgia, serif">Auren</text>
    </g>
    <g id="nav-links" font-size="13.5" fill="#241B14" fill-opacity="0.55">
      <text x="620" y="58">Features</text>
      <text x="716" y="58">How it works</text>
      <text x="840" y="58">Integrations</text>
      <text x="956" y="58">Docs</text>
    </g>
    <g id="nav-cta">
      <rect x="1188" y="34" width="120" height="38" rx="10" fill="#E8593C"/>
      <text x="1248" y="58" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Get started</text>
    </g>
  </g>

  <g id="hero-eyebrow">
    <rect x="596" y="150" width="248" height="30" rx="15" fill="#E8593C" fill-opacity="0.09"/>
    <circle cx="620" cy="165" r="3.5" fill="#E8593C"/>
    <text x="720" y="170" font-size="12" font-weight="600" letter-spacing="0.6" fill="#E8593C" text-anchor="middle">Now in beta · Gmail, Calendar, GitHub</text>
  </g>

  <g id="hero-headline" text-anchor="middle" font-family="Cabinet Grotesk, Georgia, serif" fill="#241B14">
    <text x="720" y="278" font-size="76" letter-spacing="-2">Your workspace,</text>
    <text x="720" y="356" font-size="76" letter-spacing="-2">one command.</text>
  </g>

  <g id="hero-sub">
    <text x="720" y="410" font-size="18" fill="#241B14" fill-opacity="0.5" text-anchor="middle">Auren reads your mail, calendar and repos — then shows you</text>
    <text x="720" y="438" font-size="18" fill="#241B14" fill-opacity="0.5" text-anchor="middle">exactly what it's about to do, before it does it.</text>
  </g>

  <g id="hero-cta">
    <g id="cta-primary">
      <rect x="592" y="480" width="150" height="50" rx="12" fill="#E8593C"/>
      <text x="667" y="511" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Get started</text>
    </g>
    <g id="cta-secondary">
      <rect x="756" y="480" width="150" height="50" rx="12" fill="none" stroke="#241B14" stroke-opacity="0.15"/>
      <text x="831" y="511" font-size="15" font-weight="600" fill="#241B14" text-anchor="middle">See how it works</text>
    </g>
  </g>

  <!-- The product panel peeking up from the fold. In AE, push this on its own
       Z layer so the hero copy parallaxes against it. -->
  <g id="hero-panel">
    <rect x="240" y="596" width="960" height="360" rx="20" fill="#FFFFFF" stroke="#241B14" stroke-opacity="0.08" filter="url(#softShadow)"/>
    <rect x="240" y="596" width="960" height="52" rx="20" fill="#FAF8F5"/>
    <rect x="240" y="628" width="960" height="20" fill="#FAF8F5"/>
    <rect x="240" y="647" width="960" height="1" fill="#241B14" opacity="0.08"/>
    <g id="panel-dots">
      <circle cx="272" cy="622" r="5" fill="#241B14" opacity="0.12"/>
      <circle cx="292" cy="622" r="5" fill="#241B14" opacity="0.12"/>
      <circle cx="312" cy="622" r="5" fill="#241B14" opacity="0.12"/>
    </g>

    <g id="panel-command">
      <rect x="288" y="684" width="864" height="48" rx="12" fill="#FAF8F5" stroke="#E8593C" stroke-opacity="0.35"/>
      <circle cx="318" cy="708" r="9" fill="#F5845E"/>
      <text x="344" y="714" font-size="14" fill="#241B14">Schedule a 30-min sync with @Sarah Thursday 2pm</text>
    </g>

    <g id="panel-action-1">
      <rect x="288" y="756" width="864" height="60" rx="12" fill="#FFFFFF" stroke="#241B14" stroke-opacity="0.08"/>
      <rect x="308" y="774" width="24" height="24" rx="7" fill="#E8593C" fill-opacity="0.12"/>
      <text x="348" y="782" font-size="13" font-weight="600" fill="#241B14">calendar create</text>
      <text x="348" y="800" font-size="12" fill="#241B14" opacity="0.5">Create a 30-min Google Meet, Thursday 2:00 PM</text>
    </g>
    <g id="panel-action-2">
      <rect x="288" y="828" width="864" height="60" rx="12" fill="#FFFFFF" stroke="#241B14" stroke-opacity="0.08"/>
      <rect x="308" y="846" width="24" height="24" rx="7" fill="#E8593C" fill-opacity="0.12"/>
      <text x="348" y="854" font-size="13" font-weight="600" fill="#241B14">gmail send</text>
      <text x="348" y="872" font-size="12" fill="#241B14" opacity="0.5">Email sarah@example.com the agenda and meeting link</text>
    </g>
  </g>
</svg>
